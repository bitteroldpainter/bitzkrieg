      // STAT COST

      // ===== Nov 2026 rules: toughness pricing, ability rules, legacy migration =====
      // Toughness: HP and DEF priced together = round(HP x DEF multiplier) - 7.
      var DEF_MULT = { 5: 1.47, 6: 1.33, 7: 1.20, 8: 1.10, 9: 1.00, 10: 0.92, 11: 0.84 };
      function toughnessCost (hp, def) {
        var m = DEF_MULT[def];
        if (m == null) m = 1;
        return Math.round((hp || 0) * m) - 7;

      // Abilities that cannot be taken together.
      var ABILITY_EXCLUSIONS = [

      function abilityNameById (id) {
        for (var i = 0; i < FIGHTER_ABILITIES.length; i++) if (FIGHTER_ABILITIES[i].id === id) return FIGHTER_ABILITIES[i].name;
        return id;
      }
      function abilityConflictMessage (newId, list) {
        for (var i = 0; i < ABILITY_EXCLUSIONS.length; i++) {
          var pair = ABILITY_EXCLUSIONS[i], other = null;
          if (pair[0] === newId) other = pair[1]; else if (pair[1] === newId) other = pair[0];
          if (!other) continue;
          for (var j = 0; j < (list || []).length; j++) {
            if (list[j] && list[j].id === other) {

            }

      // Ranged weapons that may be fired twice (Pistols/Grenades and Light/Medium).

      // Clamp stats to current limits (e.g. old 4 AP Fighters load as 3 AP).
      function clampStatsToLimits (stats) {
        if (!stats) return;

          var c = STAT_CONFIG[i], v = stats[c.key];
          if (typeof v !== "number") continue;
          if (v > c.max) stats[c.key] = c.max;
          if (v < c.min) stats[c.key] = c.min;

        for (var ci = 0; ci < RANGED_CATEGORIES.length; ci++) if (RANGED_CATEGORIES[ci].key === "pistols") cat = RANGED_CATEGORIES[ci];
        for (var i = 0; i < rw.length; i++) {
          if (!rw[i] || !cat || cat.ids.indexOf(rw[i].id) === -1) continue;

      function maxRangedWeaponCost (f) {
        var m = 0, rw = f.rangedWeapons || [];
        for (var i = 0; i < rw.length; i++) {
          var p = (typeof rw[i].points === "number") ? rw[i].points : 0;

      function applyPercentTotalAbilities (f) {
        // Total cost excluding the percentTotal abilities themselves.
        var p = f.points || {}, i;
        var pctSum = 0;

          if (f.abilities[i].dynamicType === "percentTotal" && typeof f.abilities[i].points === "number") pctSum += f.abilities[i].points;
        }
        var others = (p.base || 0) + (p.stats || 0) + (p.warlock || 0) + (p.ccWeapons || 0) +
                     (p.rangedWeapons || 0) + (p.abilities || 0) - pctSum + (p.leaderAbilities || 0) +

        for (i = 0; i < (f.abilities || []).length; i++) {

      function recalcStatCost () {
        var total = 0;
        for (var i = 0; i < STAT_CONFIG.length; i++) {
          var cfg = STAT_CONFIG[i];
          if (cfg.key === "hp" || cfg.key === "def") continue; // priced together below
          var base = cfg.base;
          var cur = fighter.stats[cfg.key];
          if (cur === base) continue;
          var step = (cur > base) ? 1 : -1;
          var lowerIsBetter = !!cfg.lowerIsBetter;

          for (var v = base; v !== cur; v += step) {
            var next = v + step;
            var improving = lowerIsBetter ? (next < v) : (next > v);
            if (improving) {

            } else {

            }
          }

        total += toughnessCost(fighter.stats.hp, fighter.stats.def);
        fighter.points.stats = total;

      function recalcWarlockCost () {

      // Build profile string with upgrades included.
      // Dual-profile weapons are rendered from cardProfiles on the Fighter Card,
      // so the same upgrades must also be applied to every individual profile.
      function buildWeaponProfile (weapon) {
        function addUniqueRules (baseText, rules) {
          var text = baseText || "";
          var lower = text.toLowerCase();
          var missing = [];

          for (var i = 0; i < rules.length; i++) {
            if (lower.indexOf(rules[i].toLowerCase()) === -1) {
              missing.push(rules[i]);
              lower += ", " + rules[i].toLowerCase();
            }
          }

          if (missing.length) {
            text += (text ? ", " : "") + missing.join(", ");
          }
          return text;
        }

        var extras = [];
        var up = weapon.upgrades || {};
        if (up.poison)        extras.push("Poison/Fire");
        if (up.enchanted)     extras.push("Crits on 9+");
        if (up.cursed)        extras.push("MW (2)");
        if (up.masterCrafted) extras.push("Piercing (-2)");

        // Reroll (x) stacks: Truestrike adds Reroll (1), or +1 to an existing Reroll (x).
        // Legacy "Reroll (SR)" (removed rule) is read as Reroll (1).
        function applyReroll (text) {
          var hadSR = /Reroll\s*\(SR\)/i.test(text);
          text = text.replace(/Reroll\s*\(SR\)/gi, "Reroll (1)");
          if (!up.truestrike) return text;
          if (hadSR) return text; // old saves: the SR was the Truestrike itself
          var m = /Reroll\s*\((\d+)\)/i.exec(text);
          if (m) return text.replace(m[0], "Reroll (" + (parseInt(m[1], 10) + 1) + ")");
          return text + (text ? ", " : "") + "Reroll (1)";
        }

        // Boost (x) stacks like Reroll (x); "Boost (x) Cover" is a different rule and is left alone.
        function applyBoost (text) {
          return text; // Boost (1) upgrade removed
          var m = /Boost\s*\((\d+)\)(?!\s*Cover)/i.exec(text);
          if (m) return text.replace(m[0], "Boost (" + (parseInt(m[1], 10) + 1) + ")");
          return text + (text ? ", " : "") + "Boost (1)";
        }

        var baseText = weapon.baseProfile || weapon.profile || "";
        var text = addUniqueRules(applyBoost(applyReroll(baseText)), extras);
        weapon.profile = text; // keep summary in sync

        if (weapon.cardProfiles && weapon.cardProfiles.length) {
          // Capture an immutable source the first time an older saved Fighter is edited.
          if (!weapon.baseCardProfiles || !weapon.baseCardProfiles.length) {

            var updated = deepClone(cardProfile);
            updated.profile = addUniqueRules(applyBoost(applyReroll(cardProfile.profile || "")), extras);
            return updated;
          });
        }

        return text;
      }

      // Compute upgrade cost for a single weapon
      function computeWeaponUpgradeCost (weapon) {
        if (!weapon.upgrades) return 0;
        var count = 0;
        if (weapon.upgrades.poison)        count++;
        if (weapon.upgrades.enchanted)     count++;
        if (weapon.upgrades.cursed)        count++;
        if (weapon.upgrades.truestrike)    count++;
        if (weapon.upgrades.masterCrafted) count++;
        if (count === 0) return 0;
        return 2 + (count - 1) * 4; // first = 2, others = 4
      }

      // WEAPON COST (base + upgrades)
      function recalcWeaponPoints () {
        var sumCC = 0;
        var sumR = 0;
        var i;

        for (i = 0; i < fighter.ccWeapons.length; i++) {
          var wc = fighter.ccWeapons[i];
          var base = (wc.basePoints != null) ? wc.basePoints : wc.points;
          var upgCost = computeWeaponUpgradeCost(wc);
          wc.points = base + upgCost;
          sumCC += wc.points;
        }

        for (i = 0; i < fighter.rangedWeapons.length; i++) {
          var rw = fighter.rangedWeapons[i];
          var baseR = (rw.basePoints != null) ? rw.basePoints : rw.points;
          var upgCostR = computeWeaponUpgradeCost(rw);
          rw.points = baseR + upgCostR;
          sumR += rw.points;
        }

        fighter.points.ccWeapons = sumCC;
        fighter.points.rangedWeapons = sumR;
        if (typeof recalcAbilityPoints === "function") recalcAbilityPoints();
      }

      // ABILITY / SPELL / EQUIPMENT COST
      // ABILITY / SPELL / EQUIPMENT COST
      function recalcAbilityPoints () {
        var i, sumA = 0, sumL = 0, sumS = 0, sumE = 0;

        // Fighter Abilities (some with dynamic HP-based cost)
        for (i = 0; i < fighter.abilities.length; i++) {
          var ab = fighter.abilities[i];
          var p = 0;

          if (ab.dynamicType === "percentHp") {
            var hp = fighter.stats.hp || 0;
            var factor = ab.dynamicFactor || 0;
            p = Math.ceil(hp * factor);
            ab.points = p; // keep stored value updated
          } else if (ab.dynamicType === "hpStat") {
            var hp2 = fighter.stats.hp || 0;
            var factor2 = (ab.dynamicFactor != null) ? ab.dynamicFactor : 1;
            p = Math.round(hp2 * factor2);
            ab.points = p;
          } else if (ab.dynamicType === "apScaled") {
            // base cost + 6 per AP above 2 (used by Wrath & Ruin's Superhuman Warrior)
            var apNow = fighter.stats.ap || 2;
            p = (ab.dynamicFactor || 0) + 6 * Math.max(0, apNow - 2);
            ab.points = p;
          } else if (ab.dynamicType === "maxRanged") {
            p = maxRangedWeaponCost(fighter);
            ab.points = p;
          } else if (ab.dynamicType === "maxPistol") {
            p = maxPistolWeaponCost(fighter);
            ab.points = p;
          } else if (ab.dynamicType === "percentTotal") {
            p = (typeof ab.points === "number") ? ab.points : 0; // finalised below
          } else {
            p = ab.points || 0;
          }

          sumA += p;
        }

        // Leader Abilities (all 0)
        for (i = 0; i < fighter.leaderAbilities.length; i++) {
          sumL += fighter.leaderAbilities[i].points || 0;
        }

        // Psychic Powers (all 0)
        for (i = 0; i < fighter.spells.length; i++) {
          sumS += fighter.spells[i].points || 0;
        }

        // Equipment (with dynamic items)
        var baseline = (fighter.points.base || 0) + (fighter.points.stats || 0);
        if (baseline < 0) baseline = 0;

        for (i = 0; i < fighter.equipment.length; i++) {
          var eq = fighter.equipment[i];
          var ep = 0;
          if (eq.dynamicType === "percentStats") {
            var factorEq = eq.dynamicFactor || 0;
            ep = Math.ceil(baseline * factorEq);
            eq.points = ep;
          } else {
            ep = eq.points || 0;
          }
          sumE += ep;
        }

        fighter.points.abilities       = sumA;
        fighter.points.leaderAbilities = sumL;
        fighter.points.spells          = sumS;
        fighter.points.equipment       = sumE;

        applyPercentTotalAbilities(fighter);

        // 🔑 Make sure the Selected lists show the updated point values
        refreshAbilityEquipmentDisplays();
      }

          "section-abilities",
          "section-leader",
          "section-spells",
          "section-equipment",
          "section-summary"
        ];

        function setActiveTab (targetId) {
          var i;
          for (i = 0; i < tabs.length; i++) {
            var tab = tabs[i];
            var tTarget = tab.getAttribute("data-target");
            if (tTarget === targetId) {
              tab.classList.add("active");

      // INIT

      // ================= JSON Save/Load + Autosave =================
      var MRFB_STORAGE_KEY = B28.game.storagePrefix + "_fighter_autosave_v1";

      function deepClone(obj){
        try { return JSON.parse(JSON.stringify(obj)); }
        catch(e){ return null; }
      }

      function buildExportPayload(){
        // Ensure all derived values are up to date before exporting
        try{
          recalcStatCost();
          recalcWarlockCost();
          recalcWeaponPoints();
          recalcAbilityPoints();
        }catch(e){}
        return {
          app: "Mortalis Fighter Builder",
          game: B28.gameKey,
          version: 1,
          savedAt: new Date().toISOString(),
          fighter: deepClone(fighter)
        };
      }

      function downloadJson(filename, dataObj){
        var jsonStr = JSON.stringify(dataObj, null, 2);
        var blob = new Blob([jsonStr], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){
          try{ URL.revokeObjectURL(url); }catch(e){}
          try{ document.body.removeChild(a); }catch(e){}
        }, 0);
      }

      function safeAssign(target, src){
        if (!src || typeof src !== "object") return;
        Object.keys(src).forEach(function(k){ target[k] = src[k]; });
      }

      function applyImportedFighterState(imported){
        if (!imported || typeof imported !== "object") throw new Error("Invalid JSON (no fighter object).");

        function normalizeUpgrades(upgrades){
          return {
            poison: !!(upgrades && upgrades.poison),
            enchanted: !!(upgrades && upgrades.enchanted),
            cursed: !!(upgrades && upgrades.cursed),
            truestrike: !!(upgrades && upgrades.truestrike),
            masterCrafted: !!(upgrades && upgrades.masterCrafted),
      boost: false /* Boost (1) upgrade removed */
          };
        }

        function findCurrentItem(srcArray, importedItem){
          if (!Array.isArray(srcArray) || !importedItem) return null;
          var impId = (importedItem.id != null) ? String(importedItem.id) : "";
          var impName = (importedItem.name != null) ? String(importedItem.name) : "";
          // Legacy: Extremely Resilient was merged into Resilient.
          if (impId === "extremelyResilient") impId = "resilient";
          if (impName === "Extremely Resilient") impName = "Resilient";

          var i, it;
          if (impId) {
            for (i = 0; i < srcArray.length; i++) {
              it = srcArray[i];
              if (String(it.id) === impId) return it;
            }
          }
          if (impName) {
            for (i = 0; i < srcArray.length; i++) {
              it = srcArray[i];
              if (String(it.name) === impName) return it;
            }
          }
          return null;
        }

        function rebindWeaponList(importedList, srcArray){
          if (!Array.isArray(importedList)) return [];
          var out = [];
          for (var i = 0; i < importedList.length; i++) {
            var item = importedList[i];
            if (!item || typeof item !== "object") continue;

            var current = findCurrentItem(srcArray, item);
            if (current) {
              var rebound = {
                id: current.id,
                name: ((item.name != null && String(item.name).trim() && String(item.name) !== String(current.name) && !isLegacyNameFor(current.id, String(item.name))) ? String(item.name) : current.name),
                baseProfile: current.profile,
                profile: current.profile,
                cardProfiles: current.cardProfiles ? deepClone(current.cardProfiles) : (item.cardProfiles ? deepClone(item.cardProfiles) : undefined),
                baseCardProfiles: current.baseCardProfiles ? deepClone(current.baseCardProfiles) : (item.baseCardProfiles ? deepClone(item.baseCardProfiles) : (current.cardProfiles ? deepClone(current.cardProfiles) : (item.cardProfiles ? deepClone(item.cardProfiles) : undefined))),
                basePoints: current.points,
                points: current.points,
                upgrades: normalizeUpgrades(item.upgrades)
              };
              if (item.displayNameOverride != null && String(item.displayNameOverride).trim()) {
                rebound.displayNameOverride = String(item.displayNameOverride);
              }
              out.push(rebound);
            } else {
              var fallback = {
                id: item.id,
                name: item.name || "Unknown",
                baseProfile: item.baseProfile || item.profile || "",
                profile: item.baseProfile || item.profile || "",
                cardProfiles: item.cardProfiles ? deepClone(item.cardProfiles) : undefined,
                baseCardProfiles: item.baseCardProfiles ? deepClone(item.baseCardProfiles) : (item.cardProfiles ? deepClone(item.cardProfiles) : undefined),
                basePoints: (item.basePoints != null ? item.basePoints : (item.points || 0)),
                points: (item.basePoints != null ? item.basePoints : (item.points || 0)),
                upgrades: normalizeUpgrades(item.upgrades)
              };
              if (item.displayNameOverride != null && String(item.displayNameOverride).trim()) {
                fallback.displayNameOverride = String(item.displayNameOverride);
              }
              out.push(fallback);
            }
          }
          return out;
        }

        function rebindSimpleList(importedList, srcArray, isSpell){
          if (!Array.isArray(importedList)) return [];
          var out = [];
          for (var i = 0; i < importedList.length; i++) {
            var item = importedList[i];
            if (!item || typeof item !== "object") continue;

            var current = findCurrentItem(srcArray, item);
            if (current) {
              var rebound = {
                id: current.id,
                name: ((item.name != null && String(item.name).trim() && String(item.name) !== String(current.name) && !isLegacyNameFor(current.id, String(item.name))) ? String(item.name) : current.name),
                points: (isSpell ? 0 : (current.points || 0)),
                profile: current.profile,
                effect: current.effect,
                dynamicType: current.dynamicType,
                dynamicFactor: current.dynamicFactor,
                dynamicMin: current.dynamicMin,
                cv: current.cv,
                category: current.category || item.category
              };
              if (item.displayNameOverride != null && String(item.displayNameOverride).trim()) {
                rebound.displayNameOverride = String(item.displayNameOverride);
              }
              out.push(rebound);
            } else {
              var fallback = {
                id: item.id,
                name: item.name || "Unknown",
                points: (isSpell ? 0 : (item.points || 0)),
                profile: item.profile,
                effect: item.effect,
                dynamicType: item.dynamicType,
                dynamicFactor: item.dynamicFactor,
                cv: item.cv,
                category: item.category
              };
              if (item.displayNameOverride != null && String(item.displayNameOverride).trim()) {
                fallback.displayNameOverride = String(item.displayNameOverride);
              }
              out.push(fallback);
            }
          }
          return out;
        }

        // Replace top-level scalar/flags
        fighter.name = imported.name || "";
        fighter.isWarlock = !!imported.isWarlock;
        fighter.isMasterWarlock = !!imported.isMasterWarlock;

        // Portrait (optional)
        fighter.portraitDataUrl = (typeof imported.portraitDataUrl === "string") ? imported.portraitDataUrl : (fighter.portraitDataUrl || "");
        fighter.portraitKey = (typeof imported.portraitKey === "string") ? imported.portraitKey : (fighter.portraitKey || "");

        // Stats
        if (!fighter.stats) fighter.stats = {};
        safeAssign(fighter.stats, imported.stats || {});
        clampStatsToLimits(fighter.stats);
        try { imported = JSON.parse(JSON.stringify(imported)); } catch (e) {}
        migrateLegacyAbilities(imported);

        // Lists: rebuild from CURRENT in-code libraries so updated costs/rules are used
        fighter.ccWeapons      = rebindWeaponList(imported.ccWeapons, CC_WEAPONS);
        fighter.rangedWeapons  = rebindWeaponList(imported.rangedWeapons, RANGED_WEAPONS);
        fighter.abilities      = rebindSimpleList(imported.abilities, FIGHTER_ABILITIES, false);
        fighter.leaderAbilities= rebindSimpleList(imported.leaderAbilities, LEADER_ABILITIES, false);
        fighter.spells         = rebindSimpleList(imported.spells, SPELLS, true);
        fighter.equipment      = rebindSimpleList(imported.equipment, EQUIPMENT, false);

        // Points block: keep base if present, otherwise default
        if (!fighter.points) fighter.points = {};
        var baseDefault = 16;
        fighter.points.base = (imported.points && typeof imported.points.base === "number") ? imported.points.base : (fighter.points.base || baseDefault);

        // Recompute all derived points and refresh UI
        recalcStatCost();
        recalcWarlockCost();
        recalcWeaponPoints();
        recalcAbilityPoints();

        // Re-render all panels to ensure checkboxes + selected lists match
        initStats();
        initWeaponsCC();
        initWeaponsRanged();
        initSimplePanel("section-abilities", "Fighter Abilities", FIGHTER_ABILITIES, "abilities", false, null);
        initSimplePanel("section-leader",   "Leader Abilities",  LEADER_ABILITIES,  "leaderAbilities", false, 2);
        initSimplePanel("section-spells",   "Spells",            SPELLS,            "spells", true, null);
        initSimplePanel("section-equipment","Equipment",         EQUIPMENT,         "equipment", false, null);

        refreshTotal();
        updateSummary();
        try{ initTabs(); }catch(e){}
      }

      function importFromJsonText(jsonText){
        var parsed;
        try { parsed = JSON.parse(jsonText); } catch(e){ throw new Error("Invalid JSON."); }

        // A fighter made for the other game: offer to switch game, then load it there
        var fileGame = B28.detectGame(parsed);
        if (fileGame && fileGame !== B28.gameKey) {
          var other = B28.GAMES[fileGame].name;
          if (confirm("This fighter was made for " + other + ". Switch to " + other + " and load it there?")) {
            try { sessionStorage.setItem("b28_pending_import", jsonText); } catch (e) {}
            B28.setGame(fileGame);
            return false;
          }
        }
        // Accept either {fighter:{...}} payloads or plain fighter objects
        var f = parsed && parsed.fighter ? parsed.fighter : parsed;
        applyImportedFighterState(f);
      }

      async function autosaveNow(){
        try{
          var payload = buildExportPayload();
        try{
          if (payload && payload.fighter){
            var pKey = (payload.fighter.portraitKey && String(payload.fighter.portraitKey).trim()) ? String(payload.fighter.portraitKey).trim() : "";
            var pData = (payload.fighter.portraitDataUrl && String(payload.fighter.portraitDataUrl).trim()) ? String(payload.fighter.portraitDataUrl).trim() : "";
            if (!pKey && ctx.entryId) pKey = String(ctx.entryId);
            if (pData){
              if (!pKey) pKey = "p_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
              payload.fighter.portraitKey = pKey;
              try{ await mrPortraitSet(pKey, pData); }catch(_e){}
            }
            payload.fighter.portraitDataUrl = "";
          }
        }catch(_e){}
          if (!payload || !payload.fighter) return;
          localStorage.setItem(MRFB_STORAGE_KEY, JSON.stringify(payload));
        }catch(e){}
      }

      var __autosaveTimer = null;
      function autosaveSoon(){
        if (__autosaveTimer) clearTimeout(__autosaveTimer);
        __autosaveTimer = setTimeout(function(){
          __autosaveTimer = null;
          autosaveNow();
        }, 650);
      }

      // A fighter waiting to be loaded after switching game (see importFromJsonText)
      function b28ApplyPendingImport(){
        var pend = null;
        try { pend = sessionStorage.getItem("b28_pending_import"); sessionStorage.removeItem("b28_pending_import"); } catch (e) {}
        if (!pend) return;
        try { importFromJsonText(pend); autosaveNow(); } catch (e) { alert("Load failed: " + e.message); }
      }
      window.b28ApplyPendingImport = b28ApplyPendingImport;

      function tryLoadAutosave(){
        try{
          var raw = localStorage.getItem(MRFB_STORAGE_KEY);
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (!parsed) return;
          if (!parsed.fighter) return;
          applyImportedFighterState(parsed.fighter);
        }catch(e){
          // ignore
        }
      }

      function clearAutosave(){
        try{
          if (__autosaveTimer) { clearTimeout(__autosaveTimer); __autosaveTimer = null; }
          localStorage.removeItem(MRFB_STORAGE_KEY);
        }catch(e){}
      }

      function setupJsonUi(){
        var btnSave = document.getElementById("btn-save-json");
        var inputLoad = document.getElementById("file-load-json");
        var btnClear = document.getElementById("btn-clear-autosave");

        if (btnSave){
          btnSave.addEventListener("click", function(){
            var payload = buildExportPayload();
            var nm = (fighter.name && fighter.name.trim()) ? fighter.name.trim() : "fighter";
            var safe = nm.replace(/[^\w\-]+/g, "_").slice(0, 50) || "fighter";
            downloadJson(B28.game.filePrefix + safe + ".json", payload);
          });
        }

        if (inputLoad){
          inputLoad.addEventListener("change", function(){
            var file = this.files && this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(){
              try{
                if (importFromJsonText(String(reader.result || "")) === false) { inputLoad.value = ""; return; }
                autosaveNow(); // immediately update local autosave with loaded state
                alert("Loaded!");
              }catch(e){
                alert("Load failed: " + e.message);
              }
              inputLoad.value = ""; // reset so re-loading same file triggers change
            };
            reader.onerror = function(){ alert("Load failed: could not read file."); inputLoad.value = ""; };
            reader.readAsText(file);
          });
        }

        if (btnClear){
          btnClear.addEventListener("click", function(){
            clearAutosave();
            alert("Autosave cleared.");
          });
        }

        // Generic autosave: catch most interactions without editing every handler
        document.addEventListener("input", autosaveSoon, true);
        document.addEventListener("change", autosaveSoon, true);
        document.addEventListener("click", function(e){
          // Ignore clicks on JSON/autosave controls so we don't immediately re-autosave after clearing
          if (e.target && e.target.closest && e.target.closest("#btn-save-json, #btn-clear-autosave, #file-load-json")) return;
          autosaveSoon();
        }, true);
      }


// INIT

      // ================= Portrait Cropper (Integrated) =================
      (function(){
        var btnPortrait = null;
        var ov = null;
        var fileEl = null, badgeEl = null, warnEl = null;
        var cvs = null, ctx = null;

        // Locked output size (must match your standalone cropper)
        var OUT_W = 682, OUT_H = 592;
        var TRI_BORDER_COLOR = "#D8E2D7";
        var TRI_BORDER_WIDTH = 8;

        // state
        var img = null;
        var imgReady = false;
        var offsetX = 0, offsetY = 0, scale = 1;
        var dragging = false, lastX = 0, lastY = 0;

        var pointers = new Map();
        var pinchStartDist = 0, pinchStartScale = 1;
        var pinchMid = {x:0,y:0};
        var pinchStartOffset = {x:0,y:0};

        function setWarn(msg){
          if (!warnEl) return;
          if (!msg){
            warnEl.style.display = "none";
            warnEl.textContent = "";
            return;
          }
          warnEl.textContent = msg;
          warnEl.style.display = "block";
        }

        function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }

        function trianglePath(w,h){
          // Locked: pointing down
          return [[0,0],[w,0],[w/2,h]];
        }

        function setCanvasSizeLocked(){
          if (!cvs) return;
          cvs.width = OUT_W;
          cvs.height = OUT_H;
        }

        function canvasPointFromEvent(e){
          var r = cvs.getBoundingClientRect();
          var x = (e.clientX - r.left) * (cvs.width / r.width);
          var y = (e.clientY - r.top)  * (cvs.height / r.height);
          return {x:x,y:y};
        }

        function zoomAtCanvasPoint(factor, p){
          var oldScale = scale;
          var newScale = clamp(scale * factor, 0.05, 20);
          if (newScale === oldScale) return;

          var W = cvs.width, H = cvs.height;
          var cx = W/2 + offsetX;
          var cy = H/2 + offsetY;

          var dx = p.x - cx;
          var dy = p.y - cy;

          var ratio = newScale / oldScale;
          offsetX -= dx * (ratio - 1);
          offsetY -= dy * (ratio - 1);

          scale = newScale;
          draw();
        }

        function resetView(){
          offsetX = 0; offsetY = 0; scale = 1;
          draw();
        }

        function fitToTriangle(){
          if (!imgReady) return;
          var W = cvs.width, H = cvs.height;
          var iw = img.naturalWidth || img.width;
          var ih = img.naturalHeight || img.height;

          // cover the whole output frame
          scale = Math.max(W/iw, H/ih);
          offsetX = 0; offsetY = 0;
          draw();
        }

        function draw(){
          if (!ctx) return;
          var W = cvs.width, H = cvs.height;
          ctx.clearRect(0,0,W,H);

          // Triangle clip
          var pts = trianglePath(W,H);
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(pts[0][0], pts[0][1]);
          ctx.lineTo(pts[1][0], pts[1][1]);
          ctx.lineTo(pts[2][0], pts[2][1]);
          ctx.closePath();
          ctx.clip();

          if (imgReady){
            var iw = img.naturalWidth || img.width;
            var ih = img.naturalHeight || img.height;
            var dw = iw * scale;
            var dh = ih * scale;
            var x = (W/2 - dw/2) + offsetX;
            var y = (H/2 - dh/2) + offsetY;
            ctx.drawImage(img, x, y, dw, dh);

            // border (inside clip so it never bleeds outside)
            ctx.lineWidth = TRI_BORDER_WIDTH;
            ctx.strokeStyle = TRI_BORDER_COLOR;
            ctx.beginPath();
            ctx.moveTo(pts[0][0], pts[0][1]);
            ctx.lineTo(pts[1][0], pts[1][1]);
            ctx.lineTo(pts[2][0], pts[2][1]);
            ctx.closePath();
            ctx.stroke();
          } else {
            ctx.save();
            ctx.fillStyle = "rgba(255,255,255,.08)";
            ctx.fillRect(0,0,W,H);
            ctx.restore();
          }

          ctx.restore();

          // Preview-only: darken outside triangle for clarity
          ctx.save();
          ctx.fillStyle = "rgba(0,0,0,.35)";
          ctx.beginPath();
          ctx.rect(0,0,W,H);
          ctx.moveTo(pts[0][0], pts[0][1]);
          ctx.lineTo(pts[1][0], pts[1][1]);
          ctx.lineTo(pts[2][0], pts[2][1]);
          ctx.closePath();
          ctx.fill("evenodd");
          ctx.restore();
        }

        function exportTrianglePNG(){
          var W = OUT_W, H = OUT_H;
          var off = document.createElement("canvas");
          off.width = W; off.height = H;
          var octx = off.getContext("2d", {alpha:true});

          var pts = trianglePath(W,H);
          octx.save();
          octx.beginPath();
          octx.moveTo(pts[0][0], pts[0][1]);
          octx.lineTo(pts[1][0], pts[1][1]);
          octx.lineTo(pts[2][0], pts[2][1]);
          octx.closePath();
          octx.clip();

          var iw = img.naturalWidth || img.width;
          var ih = img.naturalHeight || img.height;
          var dw = iw * scale;
          var dh = ih * scale;
          var x = (W/2 - dw/2) + offsetX;
          var y = (H/2 - dh/2) + offsetY;

          octx.drawImage(img, x, y, dw, dh);

          // baked border
          octx.lineWidth = TRI_BORDER_WIDTH;
          octx.strokeStyle = TRI_BORDER_COLOR;
          octx.beginPath();
          octx.moveTo(pts[0][0], pts[0][1]);
          octx.lineTo(pts[1][0], pts[1][1]);
          octx.lineTo(pts[2][0], pts[2][1]);
          octx.closePath();
          octx.stroke();

          octx.restore();
          return off.toDataURL("image/png");
        }

        function updatePortraitButton(){
          if (!btnPortrait) return;
          var has = (fighter && fighter.portraitDataUrl && String(fighter.portraitDataUrl).trim());
          btnPortrait.textContent = has ? "Portrait ✓" : "Portrait";
        }

        function openPortrait(){
          if (!ov) return;
          setWarn(null);
          ov.classList.add("show");
          ov.setAttribute("aria-hidden","false");
          document.body.style.overflow = "hidden";

          // init canvas
          setCanvasSizeLocked();
          ctx = cvs.getContext("2d", { alpha:true });

          // show badge
          if (badgeEl) badgeEl.textContent = (imgReady ? "Loaded" : "No image loaded") + " • " + OUT_W + "×" + OUT_H;

          // If we already have a portrait, keep it; otherwise just draw placeholder.
          draw();
        }

        function closePortrait(){
          if (!ov) return;
          ov.classList.remove("show");
          ov.setAttribute("aria-hidden","true");
          document.body.style.overflow = "";
          updatePortraitButton();
        }

        function wire(){
          btnPortrait = document.getElementById("btn-portrait");
          ov = document.getElementById("portrait-cropper-overlay");
          fileEl = document.getElementById("pc-file");
          badgeEl = document.getElementById("pc-badge");
          warnEl = document.getElementById("pc-warn");
          cvs = document.getElementById("pc-canvas");
          if (!btnPortrait || !ov || !fileEl || !cvs) return;

          // open/close
          btnPortrait.addEventListener("click", function(){ openPortrait(); });
          document.getElementById("pc-close").addEventListener("click", function(){ closePortrait(); });
          ov.addEventListener("click", function(e){
            if (e.target === ov) closePortrait();
          });

          // buttons
          document.getElementById("pc-fit").addEventListener("click", function(){ setWarn(null); fitToTriangle(); });
          document.getElementById("pc-reset").addEventListener("click", function(){ setWarn(null); resetView(); });

          document.getElementById("pc-use").addEventListener("click", function(){
            setWarn(null);
            if (!imgReady){
              setWarn("Load an image first.");
              return;
            }
            try{
              fighter.portraitDataUrl = exportTrianglePNG();
              try{
                var key = (fighter.portraitKey && String(fighter.portraitKey).trim()) ? String(fighter.portraitKey).trim() : "";
                if (!key){
                  if (window.__mr_current_roster_entry_id) key = String(window.__mr_current_roster_entry_id);
                }
                if (!key) key = "p_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
                fighter.portraitKey = key;
                mrPortraitSet(key, fighter.portraitDataUrl).catch(function(){});
              }catch(_e){}
              autosaveSoon();
              updateSummary();
              refreshTotal();
              closePortrait();
            }catch(err){
              setWarn("Could not export the portrait. Try a different image file.");
            }
          });

          // image load
          fileEl.addEventListener("change", function(e){
            var f = e.target.files && e.target.files[0];
            if (!f) return;
            setWarn(null);
            if (badgeEl) badgeEl.textContent = "Loading…";

            var url = URL.createObjectURL(f);
            var im = new Image();
            im.onload = function(){
              img = im;
              imgReady = true;
              if (badgeEl) badgeEl.textContent = "Loaded • " + OUT_W + "×" + OUT_H;
              fitToTriangle();
              try{ URL.revokeObjectURL(url); }catch(_){}
            };
            im.onerror = function(){
              imgReady = false;
              if (badgeEl) badgeEl.textContent = "Failed to load image • " + OUT_W + "×" + OUT_H;
              setWarn("Could not load that image. Try a JPG or PNG.");
              try{ URL.revokeObjectURL(url); }catch(_){}
              draw();
            };
            im.src = url;
          });

          // pointer / wheel controls
          cvs.addEventListener("pointerdown", function(e){
            cvs.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

            if (pointers.size === 1){
              dragging = true;
              lastX = e.clientX;
              lastY = e.clientY;
            } else if (pointers.size === 2){
              var pts = Array.from(pointers.values());
              pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
              pinchStartScale = scale;
              pinchStartOffset = {x: offsetX, y: offsetY};

              var midClient = {x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
              var r = cvs.getBoundingClientRect();
              pinchMid = {
                x: (midClient.x - r.left) * (cvs.width / r.width),
                y: (midClient.y - r.top)  * (cvs.height / r.height)
              };
            }
          });

          cvs.addEventListener("pointermove", function(e){
            if (!pointers.has(e.pointerId)) return;
            pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

            if (pointers.size === 1 && dragging){
              var dx = e.clientX - lastX;
              var dy = e.clientY - lastY;
              lastX = e.clientX;
              lastY = e.clientY;

              var r = cvs.getBoundingClientRect();
              offsetX += dx * (cvs.width / r.width);
              offsetY += dy * (cvs.height / r.height);
              draw();
            } else if (pointers.size === 2){
              var pts = Array.from(pointers.values());
              var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
              if (pinchStartDist > 0){
                var factor = dist / pinchStartDist;
                scale = clamp(pinchStartScale * factor, 0.05, 20);

                var ratio = scale / pinchStartScale;
                var W = cvs.width, H = cvs.height;
                var cx0 = W/2 + pinchStartOffset.x;
                var cy0 = H/2 + pinchStartOffset.y;
                var dx = pinchMid.x - cx0;
                var dy = pinchMid.y - cy0;

                offsetX = pinchStartOffset.x - dx * (ratio - 1);
                offsetY = pinchStartOffset.y - dy * (ratio - 1);
                draw();
              }
            }
          });

          cvs.addEventListener("pointerup", function(e){
            pointers.delete(e.pointerId);
            dragging = false;
            if (pointers.size === 1){
              var remaining = Array.from(pointers.values())[0];
              lastX = remaining.x; lastY = remaining.y;
              dragging = true;
            }
          });

          cvs.addEventListener("pointercancel", function(e){
            pointers.delete(e.pointerId);
            dragging = false;
          });

          cvs.addEventListener("wheel", function(e){
            e.preventDefault();
            if (!imgReady) return;
            var p = canvasPointFromEvent(e);
            var direction = Math.sign(e.deltaY);
            var factor = direction > 0 ? 0.92 : 1.08;
            zoomAtCanvasPoint(factor, p);
          }, { passive:false });

          // initial state
          setCanvasSizeLocked();
          ctx = cvs.getContext("2d", { alpha:true });
          draw();
          updatePortraitButton();
        }

      // ---- IndexedDB Portrait Store (shared with Team Builder) ----
      var PORTRAIT_DB_NAME = "warband_portraits_v1";
      var PORTRAIT_STORE   = "portraits";
      function mrOpenPortraitDB(){
        return new Promise(function(resolve, reject){
          try{
            var req = indexedDB.open(PORTRAIT_DB_NAME, 1);
            req.onupgradeneeded = function(){
              var db = req.result;
              if (!db.objectStoreNames.contains(PORTRAIT_STORE)) db.createObjectStore(PORTRAIT_STORE);
            };
            req.onsuccess = function(){ resolve(req.result); };
            req.onerror = function(){ reject(req.error); };
          }catch(err){ reject(err); }
        });
      }
      function mrPortraitSet(key, dataUrl){
        if (!key) return Promise.resolve(false);
        return mrOpenPortraitDB().then(function(db){
          return new Promise(function(resolve, reject){
            var tx = db.transaction(PORTRAIT_STORE, "readwrite");
            tx.objectStore(PORTRAIT_STORE).put(String(dataUrl||""), String(key));
            tx.oncomplete = function(){ resolve(true); };
            tx.onerror = function(){ reject(tx.error); };
          });
        });
      }
      function mrPortraitGet(key){
        if (!key) return Promise.resolve("");
        return mrOpenPortraitDB().then(function(db){
          return new Promise(function(resolve, reject){
            var tx = db.transaction(PORTRAIT_STORE, "readonly");
            var req = tx.objectStore(PORTRAIT_STORE).get(String(key));
            req.onsuccess = function(){ resolve(String(req.result||"")); };
            req.onerror = function(){ reject(req.error); };
          });
        });
      }


      // ===== Roster <-> Fighter Builder bridge (localStorage) =====
// Mirrors the Dark Realms bridge logic, but uses Mortalis-specific storage keys.
// TEAM_KEY payload: { version, savedAt, warbandName, limit, team:[{id, sourceFileName, data}] }
// EDIT_KEY payload: { version, mode:"edit"|"new", entryId, returnUrl, startedAt }
var M_TEAM_KEY = B28.game.storagePrefix + "_roster_team_state_v1";
var M_EDIT_KEY = B28.game.storagePrefix + "_roster_edit_ctx_v1";

function mSafeJsonParse(raw){
  try { return JSON.parse(raw); } catch(e){ return null; }
}
function mGetTeamState(){
  var obj = mSafeJsonParse(localStorage.getItem(M_TEAM_KEY) || "");
  if (!obj || typeof obj !== "object") return null;
  if (!Array.isArray(obj[B28.game.rosterKey])) obj[B28.game.rosterKey] = [];
  return obj;
}
function mSetTeamState(obj){
  try{
    obj.savedAt = new Date().toISOString();
    localStorage.setItem(M_TEAM_KEY, JSON.stringify(obj));
  }catch(e){}
}
function mUid(){
  return "f_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
}
function mNavigateBack(returnUrl){
  window.location.href = returnUrl || ("roster.html?game=" + B28.gameKey);
}

function mLoadFromRosterIfNeeded(){
  var ctx = mSafeJsonParse(localStorage.getItem(M_EDIT_KEY) || "");
  if (!ctx || typeof ctx !== "object") return null;
  window.__mr_current_roster_entry_id = ctx.entryId || null;
  window.__mr_card_mode = (ctx.mode === "card");
  window.__mr_card_return_url = ctx.returnUrl || ("roster.html?game=" + B28.gameKey);

  // Show roster buttons for edit/new flows; keep them hidden for pure card view.
  var btnSaveRoster = document.getElementById("btn-save-warband");
  var btnBackRoster = document.getElementById("btn-back-warband");
  var btnGenerateTop = document.getElementById("btn-generate-card-top");
  if (ctx.mode !== "card"){
    if (btnSaveRoster) btnSaveRoster.style.display = "";
    if (btnBackRoster) btnBackRoster.style.display = "";
  } else {
    if (btnSaveRoster) btnSaveRoster.style.display = "none";
    if (btnBackRoster) btnBackRoster.style.display = "none";
    if (btnGenerateTop) btnGenerateTop.style.display = "none";
  }

  if (btnBackRoster){
    btnBackRoster.onclick = function(){
      mNavigateBack(ctx.returnUrl);
    };
  }

  async function loadRosterEntryAndApply(){
    try{
      var ts = mGetTeamState();
      if (!(ts && Array.isArray(ts[B28.game.rosterKey]))) return false;
      for (var i=0; i<ts[B28.game.rosterKey].length; i++){
        var ent = ts[B28.game.rosterKey][i];
        if (!(ent && ent.id === ctx.entryId && ent.data)) continue;
        var fObj = (ent.data.fighter ? ent.data.fighter : ent.data);
        try{
          var pKey = (fObj && fObj.portraitKey) ? String(fObj.portraitKey) : String(ctx.entryId);
          if (pKey){
            var pData = await mrPortraitGet(pKey);
            if (pData && fObj) fObj.portraitDataUrl = pData;
          }
        }catch(_e){}
        try{ applyImportedFighterState(fObj); }catch(e){}
        try{
          if (typeof importFromJsonText === "function") importFromJsonText(JSON.stringify(ent.data));
        }catch(e){}
        try{
          if (fighter && (!fighter.portraitDataUrl || !String(fighter.portraitDataUrl).trim()) && fighter.portraitKey){
            var d = await mrPortraitGet(String(fighter.portraitKey));
            if (d) fighter.portraitDataUrl = d;
          }
        }catch(_e){}
        mRerenderAllPanels();
        return true;
      }
    }catch(e){
      console.warn("Roster import failed:", e);
    }
    return false;
  }

  // Auto-load for edit/card modes.
  try{
    if ((ctx.mode === "edit" || ctx.mode === "card") && ctx.entryId){
      loadRosterEntryAndApply().then(function(loaded){
        if (!loaded) return;
        if (ctx.mode === "card"){
          setTimeout(function(){
            try{
              if (typeof window.generateFighterCard === "function") window.generateFighterCard();
            }catch(e){ console.warn("Auto generate card failed:", e); }
          }, 80);
        }
      });
    }
  }catch(_e){}

  if (btnSaveRoster){
    btnSaveRoster.onclick = async function(){
      try{
        var teamState = mGetTeamState() || (function(){ var o = { version: 1, warbandName: "", limit: 0, presets: [] }; o[B28.game.rosterKey] = []; return o; })();
        if (!Array.isArray(teamState[B28.game.rosterKey])) teamState[B28.game.rosterKey] = [];

        // Always save builder payload into the roster entry (includes portraitDataUrl, etc.)
        var payload = buildExportPayload();

        if (ctx.mode === "edit" && ctx.entryId){
          var updated = false;
          for (var i=0; i<teamState[B28.game.rosterKey].length; i++){
            if (teamState[B28.game.rosterKey][i] && teamState[B28.game.rosterKey][i].id === ctx.entryId){
              teamState[B28.game.rosterKey][i].data = payload;

              // Keep existing filename if any; otherwise set a helpful one.
              if (!teamState[B28.game.rosterKey][i].sourceFileName){
                var nm = (payload && payload.fighter && payload.fighter.name && String(payload.fighter.name).trim())
                  ? String(payload.fighter.name).trim()
                  : ((fighter && fighter.name && String(fighter.name).trim()) ? String(fighter.name).trim() : "fighter");
                teamState[B28.game.rosterKey][i].sourceFileName = (B28.game.filePrefix + nm.replace(/[^\w\-]+/g,"_").slice(0,50) + ".json");
              }
              updated = true;
              break;
            }
          }

          if (!updated){
            // EntryId not found in roster (shouldn't happen, but don't wipe anything)
            var newId = ctx.entryId;
            teamState[B28.game.rosterKey].push({ id: newId, sourceFileName: B28.game.filePrefix + "fighter.json", data: payload });
            ctx.entryId = newId;
            ctx.mode = "edit";
            try{ localStorage.setItem(M_EDIT_KEY, JSON.stringify(ctx)); }catch(e){}
          }
        } else {
          // New fighter
          var nid = mUid();
          var nm2 = (payload && payload.fighter && payload.fighter.name && String(payload.fighter.name).trim())
            ? String(payload.fighter.name).trim()
            : ((fighter && fighter.name && String(fighter.name).trim()) ? String(fighter.name).trim() : "fighter");
          var fname = (B28.game.filePrefix + nm2.replace(/[^\w\-]+/g,"_").slice(0,50) + ".json");
          teamState[B28.game.rosterKey].push({ id: nid, sourceFileName: fname, data: payload });

          // Update ctx so a second save will update the same entry if they come back
          ctx.entryId = nid;
          ctx.mode = "edit";
          try{ localStorage.setItem(M_EDIT_KEY, JSON.stringify(ctx)); }catch(e){}
        }

        mSetTeamState(teamState);
      }catch(e){
        alert("Save to warband failed: " + e);
        return;
      }

      mNavigateBack(ctx.returnUrl);
    };
  }

  return ctx;
}

  function esc(s){
    return (s==null?"":String(s))
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function brToText(html){
    return (html||"").replace(/<br\s*\/?>/gi,"\n").replace(/&nbsp;/g," ");

  function renderRulesHtml(main){
    if (!main) return "";
    var txt = String(main).replace(/<br\s*\/?>/gi,"\n");

      l = l.trim();
      return l ? "<div>" + esc(l) + "</div>" : "";

// weapons profile table (auto; flexible rows)
function pickStat(keys){
  for (var i=0;i<keys.length;i++){
    var kk = keys[i];
    if (s && s[kk] != null) return s[kk];
  }
  return null;
}
function fmtPlus(v){
  if (v == null || v === "") return "";
  return String(v) + "+";
}
function parseHitUserMod(profile){
  // Matches: "Hit User", "Hit User+2", "Hit User-2", with optional spaces
  var m = String(profile||"").match(/\bHit\s*User\s*([+-]\s*\d+)?\b/i);
  if (!m) return 0;
  if (!m[1]) return 0;
  var n = parseInt(String(m[1]).replace(/\s+/g,""), 10);
  return isNaN(n) ? 0 : n;
}
function applyHitUser(baseToHit, profile){
  // In this system, a negative "to hit modifier" makes it HARDER (target number goes UP),
  // so we reverse the sign when converting to the target number.
  var b = parseInt(baseToHit, 10);
  if (isNaN(b)) return baseToHit;
  var mod = parseHitUserMod(profile);
  return b - mod;
}
function parseAtk(profile){
  var m = String(profile||"").match(/\bATK\s*([^,]+)/i);
  return m ? m[1].trim() : "";
}
function parseDmg(profile){
  var m = String(profile||"").match(/\bDMG\s*([^,]+)/i);
  return m ? m[1].trim() : "";
}
function stripProfile(p){
  if (!p) return "";
  var parts = String(p).split(",").map(function(x){return x.trim();}).filter(Boolean);
  parts = parts.filter(function(x){
    var xl = x.toLowerCase();
    if (xl.startsWith("atk")) return false;
    if (xl.startsWith("hit")) return false;
    if (xl.startsWith("dmg")) return false;
    return true;
  });
  return parts.join(", ");
}

(fighter.rangedWeapons||[]).forEach(function(w){

  // Local safety net for older saved/selected Plasma Guns that predate cardProfiles.

  if (!profiles && w && w.id === "plasmaGun") {
    profiles = [

    ];
  }
  if (profiles && profiles.length) {
    profiles.forEach(function(cp){

      weaponRows.push({

      });

  } else {

      type: "ranged",
      name:  displayName,

      dmg:   parseDmg(prof),
      hit:   fmtPlus(applyHitUser(shootVal, prof)),

    });

});

function addSection(title, arr, mainKey, keyword){
        if ((!arr || !arr.length) && !keyword) return;
        var sec = document.createElement("div");
        sec.className = "cc-sec";

addSection("Abilities", fighter.abilities);

      // autoscale only options: use scrollWidth overflow from columns
      function fitOptions(){
        try{
          var cs = window.getComputedStyle(optPill);
          var padL = parseFloat(cs.paddingLeft)  || 0;
          var padR = parseFloat(cs.paddingRight) || 0;
          var padT = parseFloat(cs.paddingTop)   || 0;
          var padB = parseFloat(cs.paddingBottom)|| 0;

          // Available content box inside the padded pill
          var availH = Math.max(0, optPill.clientHeight - padT - padB);
          var availW = Math.max(0, optPill.clientWidth  - padL - padR);

          // Printing re-lays out the text with slightly different font metrics than
          // the screen, so lines can wrap a little later and push the last entries
          // past the bottom. Fit the text into a slightly shorter box to leave
          // headroom for that. (Overflow in the two-column layout spills sideways
          // into extra columns, so it is detected through the width.)
          var safetyH = Math.max(12, availH * 0.04);
          var fitH = Math.max(0, availH - safetyH);

          optInner.style.boxSizing = "border-box";
          optInner.style.height = fitH + "px";
          optInner.style.width  = availW + "px";

          function applyScale(s){
            optInner.style.setProperty("--opt-scale", s.toFixed(4));
          }
          function fits(){
            // With font-size scaling, scrollWidth/scrollHeight reflect the real layout.
            var w = optInner.scrollWidth || 0;
            var h = optInner.scrollHeight || 0;
            return (w <= availW + 1) && (h <= fitH + 1);
          }

          applyScale(1.0);
          if (fits()) return;

          // Step down from full size and keep the first size that fits.
          // (A binary search can skip good sizes here, because entries jump between
          // the two columns as the text shrinks, so "fits" doesn't change smoothly.)
          var best = 0.20;
          for (var sc = 0.99; sc >= 0.20; sc -= 0.01){
            applyScale(sc);
            if (fits()){ best = sc; break; }
          }
          applyScale(best);

          // Final clamp: if still overflowing (e.g. single huge unbreakable entry),
          // force hidden overflow so nothing draws outside the pill.
          optInner.style.overflow = "hidden";
        }catch(e){}
      }
      function fitSoon(){
        requestAnimationFrame(function(){ requestAnimationFrame(fitOptions); });
      }

        if (ov && ov.style && ov.style.display === "block") fitSoon();
      }, { passive:true });

      requestAnimationFrame(function(){ requestAnimationFrame(fitOptions); });

    }catch(e){
